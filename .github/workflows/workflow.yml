name: Deploy Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          A1AF30: ${{ secrets.A1AF30 }}
          B42F4A: ${{ secrets.B42F4A }}
        run: |
          python3 -c "
          import pathlib, os, sys
          sec_a = os.environ.get('A1AF30', '')
          sec_b = os.environ.get('B42F4A', '')
          target = pathlib.Path('index.html')
          before = target.read_text(encoding='utf-8')
          after = before
          if sec_a:
              after = after.replace('<!-- e97cf5c5ad38fd288705ce -->', sec_a)
          if sec_b:
              after = after.replace('<!-- 81d0e695cdfa94ffb72792e6a751bb754ae0 -->', sec_b)
          if after == before and (sec_a or sec_b):
              sys.exit(1)
          if after != before:
              target.write_text(after, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
